[package]
name = "halisland"
version = "0.1.0"
description = "Halisland - Dynamic Island for Windows & macOS"
authors = ["Halil İlgez"]
license = "MIT"
repository = "https://github.com/halililgez/halisland"
edition = "2024"

[lib]
# `_lib` soneki Windows'taki bin/lib isim çakışmasını önlemek için gerekli.
name = "halisland_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
sysinfo = { version = "0.40.4", default-features = false, features = ["system", "disk", "network"] }
arboard = "3.7.0"
base64 = "0.22"
image = { version = "0.25.10", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
windows-numerics = "0.3"
windows = { version = "0.62", features = [
  "Foundation",
  "Foundation_Numerics",
  "Media_Control",
  "Win32_Graphics_Dwm",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_Graphics_Gdi",
  "Win32_NetworkManagement_IpHelper",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_Storage_FileSystem",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_Shutdown",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Storage_Streams",
  "System",
  "UI",
  "UI_Composition",
  "UI_Composition_Desktop",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Composition",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
