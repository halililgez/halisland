[package]
name = "halisland"
version = "0.1.0"
description = "Halisland - Dynamic Island for Windows & macOS"
authors = ["Halil"]
edition = "2024"

[lib]
# `_lib` soneki Windows'taki bin/lib isim çakışmasını önlemek için gerekli.
name = "halisland_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"

[target.'cfg(windows)'.dependencies]
base64 = "0.22"
windows = { version = "0.62", features = [
  "Foundation",
  "Media_Control",
  "Win32_Graphics_Gdi",
  "Win32_NetworkManagement_IpHelper",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_UI_WindowsAndMessaging",
  "Storage_Streams",
  "Win32_System_WinRT",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
