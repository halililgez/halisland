<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3ee6d6"/>
      <stop offset="0.5" stop-color="#14b8b0"/>
      <stop offset="1" stop-color="#0a5f6e"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.3" cy="0.15" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16161c"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- Zemin: macOS ızgarasına uygun 824 px'lik yuvarlak kare -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#shine)"/>

  <!-- H: iki beyaz dikme, gölgeli -->
  <g fill="#063c46" opacity="0.35" filter="url(#shadow)">
    <rect x="292" y="282" width="130" height="480" rx="65"/>
    <rect x="602" y="282" width="130" height="480" rx="65"/>
  </g>
  <rect x="292" y="272" width="130" height="480" rx="65" fill="#ffffff"/>
  <rect x="602" y="272" width="130" height="480" rx="65" fill="#ffffff"/>

  <!-- H'nin yatay çizgisi: ada -->
  <rect x="262" y="447" width="500" height="130" rx="65" fill="url(#pill)"/>
  <rect x="263.5" y="448.5" width="497" height="127" rx="63.5" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="3"/>

  <!-- Ada içinde canlı nokta ve ses dalgası -->
  <circle cx="357" cy="512" r="26" fill="#3ee6d6"/>
  <g fill="#3ee6d6">
    <rect x="530" y="494" width="22" height="36" rx="11"/>
    <rect x="566" y="476" width="22" height="72" rx="11"/>
    <rect x="602" y="486" width="22" height="52" rx="11"/>
    <rect x="638" y="497" width="22" height="30" rx="11"/>
  </g>
</svg>
