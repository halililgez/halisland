<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b3d8f"/>
      <stop offset="0.55" stop-color="#5a3aa8"/>
      <stop offset="1" stop-color="#1a1440"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.3" cy="0.15" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16161c"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <!-- Zemin: macOS ızgarasına uygun 824 px'lik yuvarlak kare -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#shine)"/>

  <!-- Ada: arkasında yumuşak ışık, üstünde siyah hap -->
  <rect x="222" y="402" width="580" height="220" rx="110" fill="#8fb4ff" opacity="0.45" filter="url(#glow)"/>
  <rect x="222" y="402" width="580" height="220" rx="110" fill="url(#pill)"/>
  <rect x="223.5" y="403.5" width="577" height="217" rx="108.5" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="3"/>

  <!-- Solda canlı nokta -->
  <circle cx="332" cy="512" r="38" fill="#43d17a"/>

  <!-- Sağda ses dalgası -->
  <g fill="#4da3ff">
    <rect x="472" y="487" width="34" height="50" rx="17"/>
    <rect x="530" y="462" width="34" height="100" rx="17" fill="#7f8cff"/>
    <rect x="588" y="442" width="34" height="140" rx="17" fill="#b58cff"/>
    <rect x="646" y="462" width="34" height="100" rx="17" fill="#7f8cff"/>
    <rect x="704" y="487" width="34" height="50" rx="17"/>
  </g>
</svg>
