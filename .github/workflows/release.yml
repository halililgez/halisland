name: Sürüm

# İki şekilde çalışır:
# - `v*` etiketi push edilince (ör. `git tag v0.2.0 && git push origin v0.2.0`):
#   Windows kurulum dosyasını derler ve TASLAK bir GitHub Release oluşturur.
#   Taslağı GitHub'da kontrol edip "Publish" demek sana kalır.
# - Actions sekmesinden elle ("Run workflow"): yalnızca derler, kurulum
#   dosyasını iş çıktısı (artifact) olarak yükler. Release oluşturmaz.
#
# macOS (.dmg) şimdilik yok; macOS fazında eklenecek.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows kurulum dosyası
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Bağımlılıklar
        run: npm ci

      # Asistan backend'i: tek dosyalık exe, kurulum dosyasına
      # tauri.release.conf.json ile `assistant/` altına girer.
      - name: Asistan (.NET) yayını
        run: dotnet publish assistant -c Release -r win-x64 -o src-tauri/assistant-bin

      - name: Etiket ile uygulama sürümü aynı mı?
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$tag" != "$conf" ]; then
            echo "::error::Etiket ($tag) ile tauri.conf.json sürümü ($conf) farklı. Önce sürümü güncelle."
            exit 1
          fi

      - name: Derle ve taslak release oluştur
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Halisland ${{ github.ref_name }}
          releaseBody: Kurulum için aşağıdaki `Halisland_..._x64-setup.exe` dosyasını indir.
          releaseDraft: true
          args: --bundles nsis --config src-tauri/tauri.release.conf.json

      - name: Yalnızca derle
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run tauri build -- --bundles nsis --config src-tauri/tauri.release.conf.json

      - name: Kurulum dosyasını yükle
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: halisland-windows-setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
