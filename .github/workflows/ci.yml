name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: Derleme (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Bağımlılıklar
        run: npm ci

      - name: Frontend (tip kontrolü + build)
        run: npm run build

      - name: Rust (clippy)
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
