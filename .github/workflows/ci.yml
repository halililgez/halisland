name: CI

on:
  pull_request:
  push:
    branches: [main]

# Fork'lardan gelen PR'lar da dahil, iş akışı yalnızca okuma yetkisiyle çalışır.
permissions:
  contents: read

jobs:
  build:
    name: Derleme (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Bağımlılıklar
        run: npm ci

      - name: Frontend (tip kontrolü + build)
        run: npm run build

      - name: Rust (clippy)
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # Uyarılar hata sayılır (csproj: TreatWarningsAsErrors).
      - name: Asistan (.NET)
        run: dotnet build assistant -c Release
